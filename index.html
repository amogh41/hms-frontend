<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
    <div class="container">
        <h1>Hospital Management System</h1>
        <div class="form-box">
            <input type="text" id="name" placeholder="Enter Name">
            <input type="number" id="age" placeholder="Enter Age">
            <input type="text" id="disease" placeholder="Enter Disease">
            <input type="text" id="phone" placeholder="Enter Phone">
            <button onclick="addPatient()">Add Patient</button>
        </div>
        <div class="table-box">
            <h2>Patient Records</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th><th>Age</th><th>Disease</th><th>Phone</th>
                    </tr>
                </thead>
                <tbody id="patientTable"></tbody>
            </table>
        </div>
    </div>
<script>
const SUPABASE_URL = "https://ekqzqlamjalakueuozxv.supabase.co";
const SUPABASE_KEY = "sb_publishable_Yso3unAMOzjoLNHVxqxmkw_SJ17c2qH";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function addPatient() {
    const name = document.getElementById("name").value;
    const age = document.getElementById("age").value;
    const disease = document.getElementById("disease").value;
    const phone = document.getElementById("phone").value;
    if (!name || !age || !disease || !phone) { alert("Please fill all fields"); return; }
    const { error } = await supabaseClient.from("patients").insert([{ name, age, disease, phone }]);
    if (error) { console.log(error); alert("Error saving patient"); }
    else { alert("Patient Saved!"); loadPatients(); }
}

async function loadPatients() {
    const { data } = await supabaseClient.from("patients").select("*");
    const table = document.getElementById("patientTable");
    table.innerHTML = "";
    data.forEach(p => {
        table.innerHTML += `<tr><td>${p.name}</td><td>${p.age}</td><td>${p.disease}</td><td>${p.phone}</td></tr>`;
    });
}
loadPatients();
</script>
</body>
</html>
